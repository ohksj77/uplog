spring:
  application:
    name: uplog
  profiles:
    # 맥 앱의 로컬 엔진. Electron은 --spring.profiles.active=desktop으로 띄운다(docs/design/desktop-app.md "실행 계약").
    default: desktop
  datasource:
    # desktop 프로필이 아닐 때만 쓰는 PostgreSQL(나중을 위해 남겨 둔다). desktop은 아래에서 H2 파일 DB로 바꾼다.
    url: ${UPLOG_DB_URL:jdbc:postgresql://localhost:5432/uplog}
    username: ${UPLOG_DB_USERNAME:uplog}
    password: ${UPLOG_DB_PASSWORD:uplog}
  flyway:
    # 마이그레이션은 각 모듈의 db/migration에 둔다. 버전은 모듈별 구간:
    # market-data V1–V99, portfolio V100–V199, local-user V200–V299, credential V300–V399, ingest V400–V499.
    # 앞 구간 모듈이 나중에 새 버전을 추가해도 적용되도록 out-of-order를 켠다.
    locations: classpath:db/migration
    out-of-order: true

uplog:
  desktop:
    # Electron이 실행마다 넘기는 256비트(base64url) 토큰. dev-open이 아니면 필수.
    launch-token: ""
    # H2 파일 DB(uplog.mv.db)·로그(logs/engine.log)·키 파일 위치
    data-dir: ${user.home}/Library/Application Support/uplog
    # web 정적 export 폴더(next build의 out/). 비어 있으면 화면 없이 API만
    web-dir: ""
    # 개발용: 토큰·Host 검사를 끈다(127.0.0.1 바인딩은 그대로). next dev(localhost:3000)가 /api를 넘긴다.
    dev-open: false
  market-data:
    public-data:
      # 공공데이터포털 금융위원회_증권상품시세정보 인증키(Decoding). 비어 있으면(기본) ETF 시세 수집 잡이 뜨지 않는다.
      service-key: ${UPLOG_PUBLIC_DATA_SERVICE_KEY:}
  credential:
    # 마스터키 보관: auto(macOS면 키체인, 아니면 key-file), keychain, file
    key-store: auto
    key-file: ${uplog.desktop.data-dir}/master.key
  connection:
    # Open API는 별도 주소 없이 tossinvest.com 설정(톱니) 팝업의 Open API 메뉴에 있다
    key-page-url: https://www.tossinvest.com/
    sync-interval: 1h
  public-ip:
    # "내 공인 IP 확인"을 누를 때만 부른다(최대 1분 기억)
    url: https://api.ipify.org?format=json
    timeout: 4s
    cache-ttl: 1m
  toss:
    # 토스증권 Open API. 클라이언트는 POST /oauth2/token과 조회용 GET만 보낼 수 있다(허용 목록).
    base-url: https://openapi.tossinvest.com
    max-retries: 3
    # 그룹별 문서 한도(초당)에 곱하는 값. 실제 토스는 1.
    rate-limit-multiplier: 1
  ingest:
    worker-enabled: true
    # 일이 있을 때 2초, 한가하면 30초마다 큐를 본다(이 엔진이 작업을 넣으면 바로 깬다)
    poll-interval: 2s
    idle-poll-interval: 30s
    max-attempts: 3
    backoff: 1m
    # 앱이 켜져 있으면 매일 07:00(KST) 직전 거래일 수집. 꺼져 있었으면 시작할 때·30분마다 놓친 날을 따라잡는다.
    daily-cron: "0 0 7 * * TUE-SAT"
    catch-up-interval: 30m

---
# 맥 앱의 로컬 엔진. 환경변수 없이 뜬다. 값은 Electron이 명령행으로 넘긴다:
#   --server.port={port} --uplog.desktop.launch-token={token} --uplog.desktop.data-dir={dir} --uplog.desktop.web-dir={dir}
# 개발: ./gradlew :app:bootRun --args='--spring.profiles.active=desktop,fake-toss --uplog.desktop.dev-open=true --uplog.desktop.data-dir=/tmp/uplog-dev'
spring:
  config:
    activate:
      on-profile: desktop
  datasource:
    url: jdbc:h2:file:${uplog.desktop.data-dir}/uplog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

server:
  # 늘 127.0.0.1에만. 다른 주소면 엔진이 시작하지 않는다.
  address: 127.0.0.1
  port: 8080

logging:
  file:
    name: ${uplog.desktop.data-dir}/logs/engine.log

---
# 가짜 토스 서버(개발·테스트용). 켜면 토스 요청이 진짜 토스 대신 같은 엔진의 /__fake-toss/**로 간다.
# 진짜 키를 넣어도 진짜 토스로 가지 않으므로, 이 프로필은 명시적으로 켤 때만 쓴다: --spring.profiles.active=desktop,fake-toss
spring:
  config:
    activate:
      on-profile: fake-toss

uplog:
  connection:
    simulated: true
  toss:
    # 포트는 서버가 뜬 뒤 정해지므로 요청 때마다 읽는다.
    base-url: http://127.0.0.1:${local.server.port:${server.port:8080}}/__fake-toss
    # 가짜 서버라 한도를 크게 둔다(역산의 일별 환율 수백 건을 몇 초 안에)
    rate-limit-multiplier: 20
    fake-server:
      enabled: true
      rate-limit-multiplier: 20
