# 로컬 PostgreSQL(서버 시절 운영 DB, 나중을 위해 남겨 둔다). 맥 앱 엔진(desktop 프로필)은 쓰지 않는다(H2 파일 DB).
# docker compose up -d 후: ./gradlew :app:bootRun  (기본 프로필 api, application.yml의 기본 접속 정보와 같다)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: uplog
      POSTGRES_USER: uplog
      POSTGRES_PASSWORD: uplog
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - uplog-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uplog -d uplog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uplog-pg:
