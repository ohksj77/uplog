<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- macOS 아이콘 그리드: 1024 캔버스 안 824 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- 바닥의 로그 칸(잔디) 한 줄 -->
  <g>
    <rect x="214" y="742" width="56" height="56" rx="12" fill="#c8102e" opacity="0.55"/>
    <rect x="288" y="742" width="56" height="56" rx="12" fill="#1450b8" opacity="0.6"/>
    <rect x="362" y="742" width="56" height="56" rx="12" fill="#f45c68" opacity="0.7"/>
    <rect x="436" y="742" width="56" height="56" rx="12" fill="#c8102e" opacity="0.8"/>
    <rect x="510" y="742" width="56" height="56" rx="12" fill="#4a8ef2" opacity="0.6"/>
    <rect x="584" y="742" width="56" height="56" rx="12" fill="#f45c68" opacity="0.85"/>
    <rect x="658" y="742" width="56" height="56" rx="12" fill="#c8102e" opacity="0.9"/>
    <rect x="732" y="742" width="56" height="56" rx="12" fill="#e0283a"/>
  </g>

  <!-- 올라가는 캔들스틱: 빨강 상승, 파랑 하락 -->
  <g stroke-linecap="round">
    <line x1="290" y1="500" x2="290" y2="672" stroke="#f45c68" stroke-width="14"/>
    <rect x="256" y="532" width="68" height="112" rx="14" fill="#e0283a"/>

    <line x1="420" y1="452" x2="420" y2="640" stroke="#4a8ef2" stroke-width="14"/>
    <rect x="386" y="480" width="68" height="120" rx="14" fill="#1d6ce0"/>

    <line x1="550" y1="352" x2="550" y2="574" stroke="#f45c68" stroke-width="14"/>
    <rect x="516" y="388" width="68" height="160" rx="14" fill="#e0283a"/>

    <line x1="680" y1="250" x2="680" y2="500" stroke="#f45c68" stroke-width="14"/>
    <rect x="646" y="282" width="68" height="190" rx="14" fill="#e0283a"/>
  </g>

  <!-- 추세선 화살표 -->
  <polyline points="232,610 380,520 512,470 648,330 770,232" fill="none" stroke="url(#trend)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M700 214 L800 206 L792 306 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
</svg>
